<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel de producción · Dubash</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/fonts/inclusive-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/js/prefs.js"></script>
</head>
<body data-mode="mobile">
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="/"><svg viewBox="0 0 30 22" aria-hidden="true"><rect x="1" y="1" width="28" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="6" y="10" width="11" height="3" fill="currentColor"/><rect x="19" y="10" width="5" height="3" fill="currentColor"/><rect x="6" y="15" width="18" height="3" fill="currentColor"/></svg>Dubash</a>
      <span class="header-section">Panel de producción</span>
      <span class="spacer"></span>
      <span id="updated" class="hint" aria-live="off">—</span>
    </div>
  </header>
  <main id="main" class="container">
    <h1>Panel de producción</h1>
    <ul class="figures" aria-label="Resumen">
      <li id="sum-live"><b>0</b><span>salas en vivo</span></li>
      <li id="sum-viewers"><b>0</b><span>personas leyendo</span></li>
      <li id="sum-segments"><b>0</b><span>líneas subtituladas</span></li>
      <li id="sum-latency"><b>—</b><span>latencia media de traducción</span></li>
      <li id="sum-errors"><b>0</b><span>errores</span></li>
    </ul>
    <div class="toolbar">
      <label class="field"><span>Token</span>
        <input id="token" type="password" autocomplete="off"></label>
      <span class="row">
        <a class="button secondary" href="/posters" target="_blank">Carteles con QR</a>
        <a class="button secondary" id="metrics" href="/metrics" target="_blank">Métricas (Prometheus)</a>
      </span>
    </div>
    <p id="error" class="error" role="alert"></p>
    <div class="table-wrap">
      <table>
        <caption>Salas</caption>
        <thead><tr><th scope="col">Sala</th><th scope="col">Estado</th><th scope="col">Audio</th><th scope="col">Texto</th><th scope="col">Público</th><th scope="col">Líneas</th><th scope="col">Latencia</th><th scope="col">Errores</th><th scope="col">Enlaces</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="/static/js/admin.js"></script>
</body>
</html>
