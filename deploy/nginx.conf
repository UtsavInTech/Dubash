events { worker_connections 8192; }
http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  upstream dubash {
    server app-a:8080 max_fails=2 fail_timeout=5s;
    server app-b:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }
  server {
    listen 8080;
    client_max_body_size 8m;
    location / {
      proxy_pass http://dubash;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Overwrite, never append: the servers trust the first address
      # (TRUST_PROXY=on) for the lockout and connection caps. nginx passes
      # Sec-WebSocket-Protocol (the console's token) through unchanged.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_cache off;
      proxy_connect_timeout 2s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
