name: Phase 4 offline integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dubash
          POSTGRES_PASSWORD: offline-test
          POSTGRES_DB: dubash
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U dubash -d dubash"
          --health-interval 3s --health-timeout 2s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 2s --health-retries 20
    env:
      SARVAM_API_KEY: ""
      SARVAM_PROBE: ""
      GEMINI_API_KEY: ""
      TEST_DATABASE_URL: postgres://dubash:offline-test@localhost:5432/dubash?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: VIEWERS=200 DURATION=9s ./deploy/loadtest.sh
      - run: ./deploy/test-cluster.sh
      - name: Validate multi-node Compose configuration
        env:
          ADMIN_TOKEN: offline-test-token-of-enough-length
          POSTGRES_PASSWORD: offline-test
          GRAFANA_PASSWORD: offline-test
        run: docker compose -f deploy/compose.phase4.yml config --quiet
      - name: Validate Prometheus rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/alerts.yml
