name: Feature request
description: Suggest an idea for Dubash.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today? Who runs into it (audience, operator, production)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like to happen, and alternatives you considered.
